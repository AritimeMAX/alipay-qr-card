<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>支付宝挪车码制作</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>支付宝挪车码制作</h1>
    <p class="hint">输入 URL，实时生成带文字的二维码卡片。点「下载」保存 PNG。</p>

    <label for="url-input">URL</label>
    <input id="url-input" type="text" autocomplete="off" spellcheck="false"
           placeholder="https://example.com">

    <div class="row" id="text-row">
      <div class="col">
        <label for="title-input">标题</label>
        <input id="title-input" type="text" maxlength="20" value="支付宝扫码">
      </div>
      <div class="col">
        <label for="subtitle-input">副标题</label>
        <input id="subtitle-input" type="text" maxlength="20" value="联系车主">
      </div>
    </div>

    <div id="error-msg" class="error" hidden></div>

    <div class="canvas-wrap">
      <div class="slider" id="slider">
        <div class="slide">
          <canvas id="canvas-qr"></canvas>
        </div>
        <div class="slide">
          <canvas id="canvas-card"></canvas>
        </div>
      </div>
    </div>

    <div class="slider-nav" id="slider-nav">
      <button type="button" class="nav-arrow" id="nav-prev" aria-label="上一张">‹</button>
      <div class="dots">
        <span class="dot active" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
      </div>
      <button type="button" class="nav-arrow" id="nav-next" aria-label="下一张">›</button>
    </div>

    <p id="meta" class="meta"></p>

    <div class="logo-row">
      <label for="logo-input" class="logo-button">
        <span id="logo-label">自定义 Logo</span>
        <input id="logo-input" type="file" accept="image/*" hidden>
      </label>
      <button id="clear-logo" type="button" class="logo-clear">还原默认</button>
    </div>

    <button id="download-btn" type="button">下载 PNG</button>
  </main>

  <!-- QR library: vendored locally, no CDN dependency. ?v=11 busts browser cache. -->
  <script src="vendor/qrcode.js?v=11"></script>
  <script type="module" src="js/app.js?v=11"></script>
</body>
</html>
