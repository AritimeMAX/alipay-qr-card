<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>支付宝挪车码生成</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>支付宝挪车码生成</h1>
    <p class="hint">输入：可选择 URL 或二维码图片。点「下载」保存 PNG。</p>

    <label for="url-input">URL</label>
    <div class="url-row">
      <input id="url-input" type="text" autocomplete="off" spellcheck="false"
             placeholder="https://example.com">
      <label for="qr-scan-input" class="scan-button" title="上传二维码图片，自动识别 URL">扫二维码</label>
      <input id="qr-scan-input" type="file" accept="image/*" hidden>
    </div>

    <div class="row" id="text-row">
      <div class="col">
        <label for="title-input">标题</label>
        <input id="title-input" type="text" maxlength="20" value="支付宝扫码">
      </div>
      <div class="col">
        <label for="subtitle-input">副标题</label>
        <input id="subtitle-input" type="text" maxlength="20" value="联系车主">
      </div>
    </div>

    <div id="error-msg" class="error" hidden></div>

    <div class="canvas-wrap">
      <div class="slider" id="slider">
        <div class="slide">
          <canvas id="canvas-qr"></canvas>
        </div>
        <div class="slide">
          <canvas id="canvas-card"></canvas>
        </div>
      </div>
    </div>

    <div class="slider-nav" id="slider-nav">
      <button type="button" class="nav-arrow" id="nav-prev" aria-label="上一张">‹</button>
      <div class="dots">
        <span class="dot active" data-slide="1"></span>
        <span class="dot" data-slide="2"></span>
      </div>
      <button type="button" class="nav-arrow" id="nav-next" aria-label="下一张">›</button>
    </div>

    <p id="meta" class="meta"></p>

    <div class="logo-row">
      <label for="logo-input" class="logo-button">
        <span id="logo-label">自定义 Logo</span>
        <input id="logo-input" type="file" accept="image/*" hidden>
      </label>
      <button id="clear-logo" type="button" class="logo-clear">移除</button>
    </div>
    <label class="logo-option">
      <input type="checkbox" id="remove-white" checked>
      <span>上传时自动去除白色背景</span>
    </label>

    <button id="download-btn" type="button">下载 PNG</button>
  </main>

  <!-- QR libraries: vendored locally, no CDN dependency. ?v=19 busts browser cache. -->
  <script src="vendor/qrcode.js?v=19"></script>
  <script src="vendor/jsQR.js?v=19"></script>
  <script type="module" src="js/app.js?v=19"></script>
</body>
</html>
